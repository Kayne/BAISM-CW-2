format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android

app:
  envs:
  - PROJECT_LOCATION: .
  - MODULE: app
  - VARIANT: debug

# Run safe_build on every pull request that targets `main`.
trigger_map:
- pull_request_target_branch: main
  workflow: safe_build

workflows:
  safe_build:
    summary: Clone, run unit tests, run mobsfscan, build the APK and deploy it.
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    # 1. Clone the repository.
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
    # 2. Unit tests — the build fails here if any test is red.
    - android-unit-test@1:
        title: Run unit tests
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: $MODULE
        - variant: debug
    # 3. Static security scan (mobsfscan) — fails the build on findings.
    - script@1:
        title: mobsfscan (SAST)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            python3 -m pip install --upgrade --quiet mobsfscan
            # --exit-warning makes mobsfscan return a non-zero exit code
            # (and therefore fail the Bitrise step) when any issue is found.
            python3 -m mobsfscan --exit-warning .
    # 4. Build the release APK.
    - android-build@1:
        title: Build APK
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: $MODULE
        - variant: $VARIANT
        - build_type: apk
    # 5. Deploy build artifacts (the APK) to bitrise.io.
    - deploy-to-bitrise-io@2: {}

  # Convenience workflow to reproduce the failing run for the report.
  fail_demo:
    summary: Same as safe_build; use it after breaking a test on purpose.
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: ./gradlew
    - android-unit-test@1:
        inputs:
        - project_location: $PROJECT_LOCATION
        - module: $MODULE
        - variant: debug
    - deploy-to-bitrise-io@2: {}
